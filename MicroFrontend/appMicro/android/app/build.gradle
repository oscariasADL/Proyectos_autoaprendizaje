apply plugin: 'com.android.application'
// Huawei
//apply plugin: 'com.huawei.agconnect'
apply plugin: 'newrelic'

android {
    namespace "co.com.adl.mb.test.avvillas"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.com.adl.mb.test.avvillas"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12193
        versionName "4.36.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            v1SigningEnabled false
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    packagingOptions {
        doNotStrip "*/*/libscm.so"
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "com.google.android.material:material:$androidxMaterialVersion"
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation 'com.google.android.gms:play-services-auth:19.0.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:17.5.0'
    implementation 'com.google.android.play:review:2.0.1'
    //implementation 'androidx.work:work-runtime:2.7.1'
    implementation "androidx.work:work-runtime:2.10.0"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    api(name: 'UtilitiesSDK', ext: 'aar')
    api(name: 'play-services-tapandpay-18.3.3', ext: 'aar')
    debugImplementation(name: 'antelop-sdk-test', ext: 'aar')
    releaseImplementation(name: 'antelop-sdk-release', ext: 'aar')
    //releaseImplementation(name: 'antelop-sdk-release-log', ext: 'aar')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch (Exception e) {
    logger.warn("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
