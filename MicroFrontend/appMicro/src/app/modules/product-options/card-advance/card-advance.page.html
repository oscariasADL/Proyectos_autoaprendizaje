<ion-content class="content-generic-stepper" [forceOverscroll]="false">
  <app-generic-stepper
          [form]="form"
          [data]="data"
          [steps]="steps"
          [title]="'CARD_ADVANCE.CARD_ADVANCE' | translate"
          [backUrl]="backUrl"
          [exitData]="exitData"
          [currentSlide]="currentSlide"
          (nextStep)="setNextStep($event)"
          (stepSelected)="stepSelected($event)"
          (slideSelected)="slideSelected($event)"
          [template]="template">
  </app-generic-stepper>
</ion-content>


<ng-template
  #template
  let-key="key"
  let-screen="data"
  let-runNextStep="nextStep">

  <div [ngSwitch]="screen">
    <app-card-advance-amount
            *ngSwitchCase="'amount'"
            [form]="form"
            (continue)="runNextStep(key)">
    </app-card-advance-amount>
  </div>

</ng-template>
