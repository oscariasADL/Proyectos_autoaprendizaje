<ion-content class="content-generic-stepper" [forceOverscroll]="false">
  <app-generic-stepper
    [form]="form"
    [data]="data"
    [steps]="steps"
    [title]="'POCKETS.CREATE.TITLE' | translate"
    [backUrl]="backUrl"
    [exitData]="exitData"
    [currentSlide]="currentSlide"
    (nextStep)="setNextStep($event)"
    (stepSelected)="stepSelected($event)"
    (slideSelected)="slideSelected($event)"
    [template]="template"
          [utagCategory]="ORGANIZER_POCKET_CONTINUE_CONFIG.event_category"
          >
  </app-generic-stepper>
</ion-content>

<ng-template
  #template
  let-key="key"
  let-screen="data"
  let-runNextStep="nextStep">

  <div [ngSwitch]="screen">
    <app-pocket-create-customization
      *ngSwitchCase="'customization'"
      [title]="'POCKETS.CREATE.DATA_STEP.TITLE' | translate"
      [form]="form"
      [products]="products$ | async"
      (continue)="runNextStep(key)">
    </app-pocket-create-customization>
  </div>

</ng-template>
