<ion-content class="content-generic-stepper" [forceOverscroll]="false">
  <app-generic-stepper
    [form]="form"
    [data]="data"
    [steps]="steps"
    [title]="'POCKET_WITH_RETURNS.TITLE' | translate"
    [backUrl]="backUrl"
    [exitData]="exitData"
    [currentSlide]="currentSlide"
    (nextStep)="setNextStep($event)"
    (stepSelected)="stepSelected($event)"
    (slideSelected)="slideSelected($event)"
    [template]="template"
          [utagCategory]="RENTABILITY_POCKET_CONTINUE_CONFIG.event_category"
          [utag]="RENTABILITY_POCKET_CONTINUE_CONFIG.event_label">
  </app-generic-stepper>

</ion-content>
<ng-template #template let-key="key" let-screen="data" let-runNextStep="nextStep">

  <div [ngSwitch]="screen">
    <app-pocket-create-customization
      *ngSwitchCase="'customization'"
      [title]="'POCKET_WITH_RETURNS.CREATE.FROM_STEP.TITLE' | translate"
      [form]="form"
      [products]="products$ | async"
      (continue)="runNextStep(key)">
    </app-pocket-create-customization>
    <app-configuration-step
      *ngSwitchCase="'configuration'"
      [form]="form"
      (continue)="runNextStep(key)"
    ></app-configuration-step>
    <app-confirmation-step
      *ngSwitchCase="'confirmation'"
      [form]="form"
      (completePocket)="createPocket()"
    ></app-confirmation-step>
  </div>
</ng-template>
