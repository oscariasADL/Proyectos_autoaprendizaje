<ion-content
  [forceOverscroll]="false"
  class="content-generic-stepper">
  <app-generic-stepper
    [form]="form"
    [data]="data"
    [steps]="steps"
    [title]="'Enviar plata' | translate"
    [backUrl]="backUrl"
    [exitData]="exitData"
    [currentSlide]="currentSlide"
    (nextStep)="setNextStep($event)"
    (stepSelected)="stepSelected($event)"
    (slideSelected)="slideSelected($event)"
    [utagCategory]="'a un celular'"
    [template]="template">
  </app-generic-stepper>
</ion-content>

<ng-template
  #template
  let-key="key"
  let-screen="data"
  let-runNextStep="nextStep"
  let-runSlideSelected="slideSelected">
  <div [ngSwitch]="screen">

    <app-transfers-cel2cel-send-toward
      *ngSwitchCase="'amount'"
      [form]="form"
      [utagCategory]="'a un celular'"
      (continue)="runNextStep(key)">
    </app-transfers-cel2cel-send-toward>

    <app-transfers-cel2cel-send-bank
      *ngSwitchCase="'toward-bank'"
      [form]="form"
      (continueSlide)="runSlideSelected($event)"
      (continue)="runNextStep(key)"></app-transfers-cel2cel-send-bank>

  </div>
</ng-template>
