<ion-content
  [forceOverscroll]="false"
  class="content-generic-stepper">
  <app-generic-stepper
    [form]="form"
    [data]="data"
    [steps]="steps"
    [title]="'TRANSFERS.AVAL_KEY.HEADER' | translate"
    [backUrl]="backUrl"
    [exitData]="exitData"
    [currentSlide]="currentSlide"
    (nextStep)="setNextStep($event)"
    (stepSelected)="stepSelected($event)"
    (slideSelected)="slideSelected($event)"
    [utagCategory]="'a un Tag AVAL'"
    [template]="template">
  </app-generic-stepper>
</ion-content>

<ng-template
  #template
  let-key="key"
  let-screen="data"
  let-runNextStep="nextStep"
  let-runSlideSelected="slideSelected">
  <div [ngSwitch]="screen">

    <app-transfers-aval-key-toward
      *ngSwitchCase="'toward-aval-key'"
      [form]="form"
      [utagCategory]="'a un Tag AVAL'"
      (continue)="runNextStep(key)"
    ></app-transfers-aval-key-toward>
  </div>
</ng-template>
