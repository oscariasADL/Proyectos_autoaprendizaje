<ion-content class="content-generic-stepper" [forceOverscroll]="false">
    <app-generic-stepper
        [form]="form"
        [data]="data"
        [steps]="steps"
        [title]="'PAYMENTS.SERVICES.TITLE' | translate"
        [backUrl]="backUrl"
        [exitData]="exitData"
        [currentSlide]="currentSlide"
        (nextStep)="setNextStep($event)"
        (stepSelected)="stepSelected($event)"
        (slideSelected)="slideSelected($event)"
        [template]="template">
    </app-generic-stepper>
</ion-content>

<ng-template
    #template
    let-key="key"
    let-screen="data"
    let-runNextStep="nextStep">

    <div [ngSwitch]="screen">
        <app-payment-unregistered-step-service
            *ngSwitchCase="'service'"
            [bill]="bill"
            [reference]="reference"
            [payValue]="payValue"
            [isBarcode]="isBarcode"
            [fromProduct]="fromProduct"
            [amountType]="amountType"
            [invoiceNumber]="invoiceNumber"
            [maxPaymentDateComplete]="maxPaymentDateComplete"
            [isSelectNewBill]="isSelectNewBill"
            (continue)="runNextStep($event ? PaymentUnregisteredServiceSlide.reference.toString() : key)">
        </app-payment-unregistered-step-service>

        <app-payment-unregistered-step-reference
            *ngSwitchCase="'reference'"
            [form]="form"
            [reference]="reference"
            [isBarcode]="isBarcode"
            [payValue]="payValue"
            [isSelectNewBill]="isSelectNewBill"
            (backClick)="runNextStep(PaymentUnregisteredServiceSlide.from.toString())"
            (continue)="runNextStep(key)">
        </app-payment-unregistered-step-reference>
    </div>
</ng-template>
