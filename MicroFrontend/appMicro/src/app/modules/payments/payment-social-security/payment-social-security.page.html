<ion-content class="content-generic-stepper" [forceOverscroll]="false">
  <app-generic-stepper
          [form]="form"
          [data]="data"
          [steps]="steps"
          [title]="'Seguridad social' | translate"
          [backUrl]="backUrl"
          [exitData]="exitData"
          [currentSlide]="currentSlide"
          (nextStep)="setNextStep($event)"
          (stepSelected)="stepSelected($event)"
          (slideSelected)="slideSelected($event)"
          [template]="template">
  </app-generic-stepper>
</ion-content>

<ng-template
  #template
  let-key="key"
  let-screen="data"
  let-runNextStep="nextStep">

  <div [ngSwitch]="screen">
    <app-social-security-contributor
            *ngSwitchCase="'contributor'"
            [form]="form"
            [contributors]="contributors$ | async"
            [workingContributors]="workingContributors$ | async"
            (continue)="runNextStep(key)"
            (exit)="runNextStep(key, $event)">
    </app-social-security-contributor>

    <app-social-security-worksheet
            *ngSwitchCase="'workSheet'"
            [form]="form"
            [date]="date$ | async"
            [socialSecurityOperator]="socialSecurityOperator$ | async"
            (continue)="runNextStep(key)">
    </app-social-security-worksheet>

    <app-social-security-value
            *ngSwitchCase="'value'"
            [form]="form"
            (continue)="runNextStep(key)">
    </app-social-security-value>
  </div>

</ng-template>
