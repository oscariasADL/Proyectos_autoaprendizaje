<div class="inactive-channel-container">
  <div class="inactive-channel-content">
    <img class="inactive-channel-logo" [src]="'av-villas-logo.svg' | imageUrl" alt="Logo" draggable="false">
    <img class="inactive-channel-icon" [src]="'icons/datos-no-coinciden.svg' | imageUrl" alt="" draggable="false">
    <p class="semi-bold inactive-channel-title">{{ 'INACTIVE_CHANNEL.TITLE' | translate }}</p>

    <ul class="avv-list-red-point inactive-channel-list">
      <li>
        <p class="small">
          {{ 'INACTIVE_CHANNEL.DESCRIPTION_1' | translate }}
        </p>
      </li>
      <li>
        <p class="small">
          {{ 'INACTIVE_CHANNEL.DESCRIPTION_2' | translate }}
        </p>
      </li>
    </ul>

    <button class="avv-btn-primary" id="inactive-channel-button" (click)="redirectLink()">
      {{ 'INACTIVE_CHANNEL.BUTTON' | translate | uppercase }}
    </button>

  </div>
</div>
